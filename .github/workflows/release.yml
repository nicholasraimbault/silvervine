# Based on cargo-dist 0.31.0's GitHub release template, with release-discipline
# hardening applied by hand:
# - default contents: read; only the final publish job may write releases
# - plan is non-mutating (`dist plan`) so it never needs repository-write
# - tag publishes gate on exact-SHA quality checks + all three ship targets
# - third-party actions pinned to full commit SHAs
# - concurrency blocks duplicate publishes for the same ref (never cancel mid-flight)
# - `v*` tag creation is maintainer-only; updates/deletions have no bypass
# - `dist … --allow-dirty` keeps plan/build/host working while this workflow
#   intentionally diverges from stock `dist init` output (do not re-run init
#   without re-applying these controls; Cargo.toml is left clean on purpose)
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * runs quality/security gates against that exact tagged commit
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release

# Least privilege by default. Individual jobs that must mint a GitHub Release
# escalate contents: write explicitly; build tooling never inherits write.
permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.96.0"
  CARGO_DIST_VERSION: "0.31.0"
  CARGO_DIST_INSTALLER_SHA256: e79d87e418b9d2cbe992d014985457c28a5a7c553add3da4ed1047e161c928f4

# Don't let two publishes for the same tag race. Never cancel an in-flight
# publish mid-upload (cancel-in-progress: false).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Release publication only accepts `v<semver>` tags. Repository rulesets
# restrict matching `refs/tags/v*` creation to the maintainer and make every
# created tag immutable, closing the exact-SHA verification/publication race.
on:
  pull_request:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' to determine what tasks we need to do. Always non-mutating
  # so this job stays contents: read (no draft release / host create side effects).
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      publishing: ${{ !github.event.pull_request }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install checksum-pinned dist
        shell: bash
        run: |
          installer="$RUNNER_TEMP/cargo-dist-installer.sh"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --output "$installer" \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh"
          echo "${CARGO_DIST_INSTALLER_SHA256}  ${installer}" | shasum -a 256 --check
          sh "$installer"
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        shell: bash
        env:
          DIST_TAG: ${{ !github.event.pull_request && github.ref_name || '' }}
        run: |
          args=(plan --allow-dirty --output-format=json)
          if [[ -n "$DIST_TAG" ]]; then
            args+=("--tag=$DIST_TAG")
          fi
          dist "${args[@]}" > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Exact-SHA quality gates for tag publishes. PRs keep plan-only behavior.
  release-fmt:
    name: release-fmt
    needs:
      - plan
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  release-clippy:
    name: release-clippy (${{ matrix.os }})
    needs:
      - plan
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          key: release-clippy-${{ matrix.os }}
      - run: cargo clippy --all-targets --all-features -- -D warnings

  release-test:
    name: release-test (${{ matrix.os }})
    needs:
      - plan
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          key: release-test-${{ matrix.os }}
      - run: cargo test --all-features --no-fail-fast

  release-deny:
    name: release-cargo-deny
    needs:
      - plan
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          # deny.toml restricts the graph to the Linux/macOS release targets,
          # so Windows-only transitive dependencies do not create false
          # advisory failures.
          command: check advisories bans licenses sources

  release-msrv:
    name: release-msrv (1.88)
    needs:
      - plan
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      # Must match `rust-version` in Cargo.toml. SHA pins the action code;
      # the toolchain itself comes from the explicit input (not the ref magic).
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          key: release-msrv
      - run: cargo build --verbose

  # Build every cargo-dist shipping target on the exact tagged SHA before publish.
  release-target-build:
    name: release-target (${{ matrix.target }})
    needs:
      - plan
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            packages: musl-tools
            # Mirror cargo-dist musl linkage (build/cargo.rs): static CRT +
            # self-contained link via musl-gcc from musl-tools.
            linker: musl-gcc
            rustflags: "-Ctarget-feature=+crt-static -Clink-self-contained=yes"
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.linker }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          key: release-target-${{ matrix.target }}
      - name: Install target packages
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - run: cargo build --release --target ${{ matrix.target }} --verbose

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ join(matrix.targets, ',') }}
      - name: Install checksum-pinned dist
        shell: bash
        run: |
          installer="$RUNNER_TEMP/cargo-dist-installer.sh"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --output "$installer" \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh"
          echo "${CARGO_DIST_INSTALLER_SHA256}  ${installer}" | shasum -a 256 --check
          sh "$installer"
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        shell: bash
        env:
          DIST_TAG: ${{ needs.plan.outputs.tag }}
          DIST_ARGS: ${{ matrix.dist_args }}
        run: |
          args=(build --allow-dirty --print=linkage --output-format=json)
          if [[ -n "$DIST_TAG" ]]; then
            args+=("--tag=$DIST_TAG")
          fi
          read -r -a dist_args <<< "$DIST_ARGS"
          dist "${args[@]}" "${dist_args[@]}" > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        env:
          DIST_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          args=(build --allow-dirty --output-format=json "--artifacts=global")
          if [[ -n "$DIST_TAG" ]]; then
            args+=("--tag=$DIST_TAG")
          fi
          dist "${args[@]}" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Read-only release preparation: generate cargo-dist's announcement metadata
  # only after all quality gates, ship-target builds, and artifacts succeed.
  host:
    needs:
      - plan
      - release-fmt
      - release-clippy
      - release-test
      - release-deny
      - release-msrv
      - release-target-build
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if every required gate + artifact
    # job succeeded (skipped is fine solely for artifact jobs that plan omitted).
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.release-fmt.result == 'success' && needs.release-clippy.result == 'success' && needs.release-test.result == 'success' && needs.release-deny.result == 'success' && needs.release-msrv.result == 'success' && needs.release-target-build.result == 'success' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    permissions:
      contents: read
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        env:
          DIST_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # GitHub hosting is implemented by the steps below; cargo-dist's host
          # upload/release steps are CI no-ops that refresh the dist-manifest.
          args=(host --allow-dirty --steps=upload --steps=release --output-format=json)
          if [[ -n "$DIST_TAG" ]]; then
            args+=("--tag=$DIST_TAG")
          fi
          dist "${args[@]}" > dist-manifest.json
          echo "artifacts prepared for release successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json

  # Sole write-capable publication boundary. Keep this to one trusted shell
  # step so no checkout, third-party action, or build tool receives the token.
  publish:
    needs:
      - plan
      - host
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.host.result == 'success' }}
    permissions:
      actions: read
      contents: write
    runs-on: "ubuntu-22.04"
    steps:
      - name: Publish exact tested commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          PRERELEASE: ${{ fromJson(needs.host.outputs.val).announcement_is_prerelease }}
          ANNOUNCEMENT_TITLE: ${{ fromJson(needs.host.outputs.val).announcement_title }}
          ANNOUNCEMENT_BODY: ${{ fromJson(needs.host.outputs.val).announcement_github_body }}
        run: |
          set -euo pipefail

          bundles="$RUNNER_TEMP/release-artifact-bundles"
          mkdir -p "$bundles" artifacts
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'artifacts-build-*' \
            --dir "$bundles"

          shopt -s nullglob
          bundle_dirs=("$bundles"/artifacts-build-*)
          if (( ${#bundle_dirs[@]} == 0 )); then
            # gh extracts directly into --dir when only one artifact matches.
            bundle_dirs=("$bundles")
          fi
          for bundle in "${bundle_dirs[@]}"; do
            while IFS= read -r -d '' file; do
              relative="${file#"$bundle"/}"
              destination="artifacts/$relative"
              if [[ -e "$destination" ]]; then
                echo "duplicate release artifact path: $relative" >&2
                exit 1
              fi
              mkdir -p "$(dirname "$destination")"
              cp -- "$file" "$destination"
            done < <(find "$bundle" -type f -print0)
          done

          tag_ref="refs/tags/$RELEASE_TAG"
          remote_refs="$(
            git ls-remote --exit-code \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              "$tag_ref" "${tag_ref}^{}"
          )"
          remote_commit=""
          while IFS=$'\t' read -r sha ref; do
            if [[ "$ref" == "$tag_ref" && -z "$remote_commit" ]]; then
              remote_commit="$sha"
            elif [[ "$ref" == "${tag_ref}^{}" ]]; then
              remote_commit="$sha"
            fi
          done <<< "$remote_refs"
          if [[ "$remote_commit" != "$RELEASE_COMMIT" ]]; then
            echo "release tag $RELEASE_TAG resolves to $remote_commit, expected $RELEASE_COMMIT" >&2
            exit 1
          fi

          mapfile -d '' -t release_artifacts < <(
            find artifacts -type f ! -name '*-dist-manifest.json' -print0 | sort -z
          )
          if (( ${#release_artifacts[@]} == 0 )); then
            echo "no release artifacts were produced" >&2
            exit 1
          fi

          notes_file="$RUNNER_TEMP/notes.txt"
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$notes_file"
          args=(
            release create "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --target "$RELEASE_COMMIT"
            --title "$ANNOUNCEMENT_TITLE"
            --notes-file "$notes_file"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}" "${release_artifacts[@]}"

  announce:
    needs:
      - plan
      - publish
    # Report success only after the write-capable publication boundary completes.
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: "ubuntu-22.04"
    steps:
      - name: Release complete
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: echo "Published $RELEASE_TAG at $RELEASE_COMMIT"
